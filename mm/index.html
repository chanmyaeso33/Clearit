<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearIt — ရှုပ်ထွေးတဲ့စာတွေကို ရှင်းရှင်းလင်းလင်း</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Clash+Display:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&family=Padauk:wght@400;700&family=Noto+Serif+Myanmar:wght@400;700;900&display=swap" rel="stylesheet">
<style>

/* ============================================================
   LANDING PAGE STYLES
   ============================================================ */

:root {
  --ink: #0c0c0e;
  --paper: #f5f2ec;
  --cream: #ede9e0;
  --red: #e8341a;
  --muted: #7a7570;
  --border: #d8d2c8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Padauk', 'DM Sans', sans-serif;
  overflow-x: hidden;
  line-height: 1.6;
}

/* Burmese-specific font sizing for readability */
.hero-headline, .section-title, .cta-title, .testimonial-text, .app-divider h2 {
  font-family: 'Noto Serif Myanmar', 'Playfair Display', serif !important;
  line-height: 1.55 !important;
  letter-spacing: 0;
}

.result-text {
  font-family: 'Noto Serif Myanmar', 'Instrument Serif', serif !important;
  line-height: 1.75 !important;
}

.hero-headline {
  line-height: 1.5 !important;
}

.audience-title, .step-title, .lang-text h3 {
  line-height: 1.5 !important;
}

.hero-sub, .step-desc, .audience-desc, .cta-sub, .stat-label {
  line-height: 1.85 !important;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 40px;
  background: rgba(245,242,236,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  font-family: 'Playfair Display', serif;
  font-weight: 900; font-size: 22px; letter-spacing: -0.5px;
}

.nav-logo span { color: var(--red); }

.nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
.nav-links a { text-decoration: none; color: var(--muted); font-size: 13px; transition: color 0.2s; }
.nav-links a:hover { color: var(--ink); }

.nav-cta {
  background: var(--ink) !important; color: var(--paper) !important;
  padding: 10px 22px; border-radius: 100px; font-size: 13px !important;
  font-weight: 500; transition: background 0.2s !important;
}

.nav-cta:hover { background: var(--red) !important; }

/* HERO */
.hero {
  min-height: 100vh;
  display: grid; grid-template-columns: 1fr 1fr;
  padding-top: 72px; overflow: hidden;
}

.hero-left {
  display: flex; flex-direction: column; justify-content: center;
  padding: 80px 56px;
}

.hero-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'DM Mono', monospace; font-size: 11px;
  letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
  margin-bottom: 28px;
}

.hero-tag::before { content: ''; display: block; width: 24px; height: 1px; background: var(--red); }

.hero-headline {
  font-family: 'Playfair Display', serif; font-weight: 900;
  font-size: clamp(38px, 4.5vw, 62px); line-height: 1.06;
  letter-spacing: -1.5px; margin-bottom: 24px;
}

.hero-headline em { font-style: italic; color: var(--red); }

.hero-sub {
  font-size: 16px; line-height: 1.75; color: var(--muted);
  max-width: 400px; margin-bottom: 40px;
}

.hero-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--ink); color: var(--paper);
  padding: 15px 30px; border-radius: 100px;
  font-size: 15px; font-weight: 500; text-decoration: none;
  border: 2px solid var(--ink); transition: all 0.2s;
}

.btn-primary:hover { background: var(--red); border-color: var(--red); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(232,52,26,0.25); }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--ink); font-size: 15px; font-weight: 500;
  text-decoration: none; padding: 15px 22px;
  border-radius: 100px; border: 2px solid var(--border); transition: all 0.2s;
}

.btn-secondary:hover { border-color: var(--ink); transform: translateY(-2px); }

.hero-right { background: var(--ink); position: relative; overflow: hidden; }

.hero-right::before {
  content: 'CLEAR';
  position: absolute; font-family: 'Playfair Display', serif;
  font-weight: 900; font-size: 160px; color: rgba(255,255,255,0.03);
  top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-15deg);
  white-space: nowrap; pointer-events: none;
}

.hero-mockup {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; padding: 40px;
}

.mockup-card {
  background: #16161e; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; padding: 28px; width: 100%; max-width: 340px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.4);
  animation: cardFloat 6s ease-in-out infinite;
}

@keyframes cardFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.mockup-input {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 14px; margin-bottom: 14px;
}

.mockup-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 7px; font-family: 'DM Mono', monospace; }
.mockup-text { font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.6; }

.mockup-btn {
  width: 100%; padding: 13px; background: #c8f050; color: #0a0a0f;
  border: none; border-radius: 10px; font-family: 'Clash Display', sans-serif;
  font-weight: 700; font-size: 14px; cursor: default; margin-bottom: 14px;
}

.mockup-result {
  background: rgba(200,240,80,0.06); border: 1px solid rgba(200,240,80,0.15);
  border-radius: 12px; padding: 14px;
}

.mockup-result-label {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: #c8f050; margin-bottom: 7px; font-family: 'DM Mono', monospace;
  display: flex; align-items: center; gap: 6px;
}

.mockup-result-label::before { content: ''; display: block; width: 12px; height: 1px; background: #c8f050; }
.mockup-result-text { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.5; }
.mockup-lang { display: inline-block; font-size: 9px; padding: 2px 8px; border-radius: 100px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.35); margin-top: 10px; font-family: 'DM Mono', monospace; }

/* MARQUEE */
.marquee-section { background: var(--ink); padding: 16px 0; overflow: hidden; }
.marquee-track { display: flex; gap: 48px; animation: marquee 22s linear infinite; white-space: nowrap; }

@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.marquee-item { display: flex; align-items: center; gap: 12px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); flex-shrink: 0; }
.marquee-dot { color: #c8f050; }

/* SECTIONS */
.lp-section { padding: 110px 60px; max-width: 1200px; margin: 0 auto; }

.section-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'DM Mono', monospace; font-size: 11px;
  letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 20px;
}

.section-tag::before { content: ''; display: block; width: 24px; height: 1px; background: var(--red); }

.section-title {
  font-family: 'Playfair Display', serif; font-weight: 900;
  font-size: clamp(32px, 3.5vw, 52px); line-height: 1.1;
  letter-spacing: -1px; margin-bottom: 56px;
}

.section-title em { font-style: italic; color: var(--red); }

/* STEPS */
.steps-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; background: var(--border); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.step-item { background: var(--paper); padding: 44px 36px; transition: background 0.3s; }
.step-item:hover { background: var(--cream); }
.step-number { font-family: 'Playfair Display', serif; font-size: 64px; font-weight: 900; color: var(--border); line-height: 1; margin-bottom: 20px; letter-spacing: -2px; }
.step-icon { font-size: 28px; margin-bottom: 14px; }
.step-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; margin-bottom: 10px; }
.step-desc { font-size: 14px; color: var(--muted); line-height: 1.7; }

/* AUDIENCE */
.audience-section { background: var(--ink); padding: 110px 60px; }
.audience-inner { max-width: 1200px; margin: 0 auto; }
.audience-section .section-tag { color: rgba(255,255,255,0.3); }
.audience-section .section-title { color: var(--paper); }
.audience-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
.audience-card { border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 36px 28px; position: relative; overflow: hidden; transition: border-color 0.3s, transform 0.3s; }
.audience-card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-4px); }
.audience-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.audience-card.students::before { background: #c8f050; }
.audience-card.workers::before { background: var(--red); }
.audience-card.media::before { background: #4da6ff; }
.audience-emoji { font-size: 32px; margin-bottom: 16px; }
.audience-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; color: var(--paper); margin-bottom: 10px; }
.audience-desc { font-size: 14px; color: rgba(255,255,255,0.4); line-height: 1.7; margin-bottom: 16px; }
.audience-use { font-size: 11px; font-family: 'DM Mono', monospace; color: rgba(255,255,255,0.2); letter-spacing: 1px; text-transform: uppercase; }

/* TESTIMONIAL */
.testimonial-section { padding: 110px 60px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
.big-quote { font-family: 'Playfair Display', serif; font-size: 160px; line-height: 0.8; color: var(--border); font-weight: 900; margin-bottom: -16px; }
.testimonial-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(22px, 2.5vw, 32px); line-height: 1.45; letter-spacing: -0.5px; margin-bottom: 28px; }
.testimonial-author { display: flex; align-items: center; gap: 14px; }
.author-avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg,#c8f050,var(--red)); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 18px; color: var(--ink); }
.author-name { font-weight: 600; font-size: 15px; }
.author-role { font-size: 13px; color: var(--muted); }
.stat-card { background: var(--cream); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 16px; transition: transform 0.2s; }
.stat-card:hover { transform: translateX(8px); }
.stat-num { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: -2px; margin-bottom: 4px; }
.stat-num span { color: var(--red); }
.stat-label { font-size: 13px; color: var(--muted); }

/* LANGUAGES */
.lang-section { background: var(--cream); padding: 72px 60px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.lang-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 40px; flex-wrap: wrap; }
.lang-text h3 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 28px; letter-spacing: -0.5px; margin-bottom: 6px; }
.lang-text p { font-size: 14px; color: var(--muted); }
.lang-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.lang-tag { padding: 7px 16px; border-radius: 100px; background: var(--paper); border: 1px solid var(--border); font-size: 12px; color: var(--ink); font-family: 'DM Mono', monospace; transition: all 0.2s; cursor: default; }
.lang-tag:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lang-tag.featured { background: var(--ink); color: #c8f050; border-color: var(--ink); }

/* CTA */
.cta-section { padding: 110px 60px; text-align: center; position: relative; overflow: hidden; }
.cta-section::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(200,240,80,0.07) 0%, transparent 70%); pointer-events: none; }
.cta-inner { max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }
.cta-section .section-tag { justify-content: center; }
.cta-title { font-family: 'Playfair Display', serif; font-weight: 900; font-size: clamp(36px, 5vw, 60px); line-height: 1.05; letter-spacing: -1.5px; margin-bottom: 20px; }
.cta-title em { font-style: italic; color: var(--red); }
.cta-sub { font-size: 16px; color: var(--muted); line-height: 1.7; margin-bottom: 40px; }
.cta-actions { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.cta-note { margin-top: 18px; font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 1px; }

/* FOOTER */
footer { background: var(--ink); color: rgba(255,255,255,0.3); padding: 40px 60px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.footer-logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 20px; color: var(--paper); }
.footer-logo span { color: var(--red); }
.footer-copy { font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
.footer-links { display: flex; gap: 20px; }
.footer-links a { font-size: 13px; color: rgba(255,255,255,0.3); text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--paper); }

/* REVEAL ANIMATION */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: none; }

/* ============================================================
   APP SECTION STYLES
   ============================================================ */

#app-section {
  --app-bg: #0a0a0f;
  --app-surface: #13131a;
  --app-border: rgba(255,255,255,0.08);
  --app-text: #f0ede8;
  --app-muted: rgba(240,237,232,0.45);
  --app-accent: #c8f050;
  --app-radius: 16px;
  --app-transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  background: var(--app-bg);
  color: var(--app-text);
  position: relative;
  transition: background var(--app-transition);
  padding: 80px 0 0;
}

.app-divider {
  background: var(--ink);
  padding: 56px 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.app-divider::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(200,240,80,0.1) 0%, transparent 70%);
}

.app-divider-tag {
  font-family: 'DM Mono', monospace; font-size: 11px;
  letter-spacing: 3px; text-transform: uppercase;
  color: rgba(255,255,255,0.3); margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}

.app-divider-tag::before, .app-divider-tag::after {
  content: ''; display: block; width: 32px; height: 1px; background: rgba(255,255,255,0.15);
}

.app-divider h2 {
  font-family: 'Playfair Display', serif; font-weight: 900;
  font-size: clamp(28px, 4vw, 48px); color: var(--paper);
  letter-spacing: -1px; line-height: 1.1; position: relative; z-index: 1;
}

.app-divider h2 em { font-style: italic; color: #c8f050; }

.app-bg-orb {
  position: absolute; width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, var(--app-accent) 0%, transparent 70%);
  opacity: 0.05; top: -200px; right: -200px; pointer-events: none;
  transition: background var(--app-transition);
  animation: orbFloat 8s ease-in-out infinite;
}

@keyframes orbFloat {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(-30px,20px) scale(1.05); }
  66% { transform: translate(20px,-30px) scale(0.97); }
}

.app-wrapper {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 20px 80px; max-width: 720px; margin: 0 auto;
}

.app-header { text-align: center; margin-bottom: 40px; }

.app-logo {
  font-family: 'Clash Display', sans-serif; font-weight: 700;
  font-size: 38px; letter-spacing: -1px; line-height: 1; margin-bottom: 8px;
}

.app-logo span { color: var(--app-accent); transition: color var(--app-transition); }
.app-tagline { font-size: 13px; color: var(--app-muted); letter-spacing: 0.5px; transition: color var(--app-transition); }

.app-version {
  display: inline-block; font-size: 10px; letter-spacing: 2px;
  padding: 3px 10px; border-radius: 100px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--app-border);
  color: var(--app-muted); margin-top: 10px; transition: all var(--app-transition);
}

.mood-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 14px; border-radius: 100px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--app-border);
  font-size: 12px; color: var(--app-muted);
  margin-top: 12px; transition: all var(--app-transition); opacity: 0;
}

.mood-badge.visible { opacity: 1; }

.mood-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--app-accent); transition: background var(--app-transition);
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.5;transform:scale(0.8);} }

/* NOTICE */
.app-notice {
  width: 100%; background: rgba(200,240,80,0.06);
  border: 1px solid rgba(200,240,80,0.15); border-radius: 12px;
  padding: 13px 16px; font-size: 12.5px; color: var(--app-muted);
  line-height: 1.6; margin-bottom: 14px; transition: all var(--app-transition);
}

.app-notice a { color: var(--app-accent); text-decoration: none; }

/* API ROW */
.api-row { width: 100%; display: flex; gap: 10px; margin-bottom: 14px; }

.api-input {
  flex: 1; background: var(--app-surface); border: 1.5px solid var(--app-border);
  border-radius: 12px; padding: 13px 16px; color: var(--app-text);
  font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none;
  transition: all var(--app-transition);
}

.api-input:focus { border-color: var(--app-accent); }
.api-input::placeholder { color: var(--app-muted); }

.forget-btn {
  background: rgba(255,255,255,0.06); border: 1.5px solid var(--app-border);
  border-radius: 12px; padding: 13px 16px; color: var(--app-muted);
  font-size: 14px; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}

.forget-btn:hover { background: rgba(255,80,80,0.15); color: #ff8080; border-color: rgba(255,80,80,0.3); }

.key-saved-banner {
  width: 100%; display: none; align-items: center; justify-content: space-between;
  background: rgba(100,220,120,0.08); border: 1px solid rgba(100,220,120,0.2);
  border-radius: 12px; padding: 11px 16px; margin-bottom: 14px; gap: 12px;
}

.key-saved-banner.visible { display: flex; }
.key-saved-banner span { font-size: 13px; color: rgba(100,220,120,0.9); }
.key-saved-banner button { background: none; border: 1px solid rgba(100,220,120,0.3); border-radius: 8px; padding: 4px 12px; color: rgba(100,220,120,0.7); font-size: 11px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.key-saved-banner button:hover { background: rgba(100,220,120,0.1); }

/* INPUT CARD */
.input-card {
  width: 100%; background: var(--app-surface); border: 1.5px solid var(--app-border);
  border-radius: var(--app-radius); padding: 22px; margin-bottom: 14px;
  transition: background var(--app-transition), border-color var(--app-transition);
}

.input-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var
